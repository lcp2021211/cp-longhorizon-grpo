# Fair 2^3 ablation base for SALT, ProGPO, and real-turn LATA.
hydra:
  searchpath:
    - pkg://verl/trainer/config
  job:
    # Keep every relative data/output path anchored at the project directory.
    chdir: false

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: experiments/tau2/train.parquet
  val_files: experiments/tau2/val.parquet
  train_batch_size: 4
  max_prompt_length: 8192
  max_response_length: 12288
  return_raw_chat: true
  # Qwen3.5 policy uses the non-thinking chat-template branch. This keeps the
  # tool-agent protocol unchanged while avoiding long hidden reasoning traces.
  apply_chat_template_kwargs:
    enable_thinking: false
  tool_config_path: configs/tool_config/tau_bench_airline_tools.yaml
  # Keep DataLoader subprocesses out of the already process-heavy Ray/vLLM job.
  dataloader_num_workers: 0
  seed: 42

actor_rollout_ref:
  model:
    # Text-only LoRA GRPO policy. Override both actor/ref paths with the
    # runner's --model-path flag or the POLICY_MODEL_PATH environment variable.
    path: ${oc.env:POLICY_MODEL_PATH,/media/public/models/huggingface/Qwen/Qwen3.5-9B}
    enable_gradient_checkpointing: true
    # Qwen3.5 is multimodal, but tau2 is text-only.
    exclude_modules: ".*visual.*"
    lora_rank: 16
    lora_alpha: 32
    # Keep false: Qwen3.5 remove-padding currently requires FlashAttention,
    # which is intentionally omitted from the CUDA 12.8 source-build environment.
    use_remove_padding: false
    use_fused_kernels: false
    override_config:
      attn_implementation: sdpa
  actor:
    # Qwen3.5 support in this project uses FSDP2; the policy is text-only LoRA.
    strategy: fsdp2
    freeze_vision_tower: true
    use_torch_compile: false
    entropy_from_logits_with_chunking: true
    # The frozen 9B base model is reloaded from model.path on resume. Persist
    # only the changing LoRA adapter (exported by the worker), Adam state, and
    # scheduler/RNG state. Compact-resume preflight rejects bad checkpoints.
    checkpoint:
      save_contents: [optimizer, extra]
      load_contents: [optimizer, extra]
    fsdp_config:
      fsdp_size: 1
      reshard_after_forward: false
      offload_policy: false
      optimizer_offload: false
      param_offload: false
      entropy_checkpointing: true
      model_dtype: bf16
      dtype: bfloat16
    optim:
      lr: 5.0e-6
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    use_fused_kernels: false
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
  rollout:
    name: vllm
    mode: async
    agent:
      default_agent_loop: tool_agent
      # Match the two concurrent sequences served by the external user simulator.
      num_workers: 2
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 15
      max_assistant_turns: 15
      max_parallel_calls: 1
      # Character limit applied to each tool response by ToolAgentLoop.
      max_tool_response_length: 2048
      tool_config_path: configs/tool_config/tau_bench_airline_tools.yaml
      interaction_config_path: configs/interaction_config/tau2_airline_progpo.yaml
    # Fixed for every variant. SALT paper default group size is 8.
    n: 8
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    calculate_log_probs: true
    gpu_memory_utilization: 0.55
    # Eager mode avoids a persistent CUDA-graph allocation in the hybrid
    # one-GPU actor/rollout process and is safer for the first smoke run.
    enforce_eager: true
    free_cache_engine: true
    enable_chunked_prefill: true
    enable_prefix_caching: false
    max_num_seqs: 16
    max_model_len: 24576
    max_num_batched_tokens: 24576
    log_prob_micro_batch_size_per_gpu: 1
    # Load the frozen base before vLLM installs its LoRA wrappers. Runtime
    # full-weight sync from a dummy model misses Qwen3.5 GDN Conv1d weights;
    # after this one-time read, veRL synchronizes only the trainable LoRA state.
    load_format: safetensors
    engine_kwargs:
      vllm:
        # Skip the unused Qwen3.5 vision encoder during text rollout.
        language_model_only: true
    val_kwargs:
      n: 1
      # Deterministic if explicitly enabled; official test is disabled in-train.
      temperature: 0.0
      top_p: 1.0
  ref:
    # Modern veRL shares actor_rollout_ref.model between actor and reference.
    strategy: fsdp2
    use_torch_compile: false
    entropy_from_logits_with_chunking: true
    fsdp_config:
      fsdp_size: 1
      reshard_after_forward: true
      offload_policy: true
      optimizer_offload: true
      param_offload: true
      model_dtype: bf16
      dtype: bfloat16
    log_prob_micro_batch_size_per_gpu: 1

algorithm:
  adv_estimator: grpo_agentic_ablation
  kl_ctrl:
    kl_coef: 0.01
  rollout_correction:
    bypass_mode: true
  # The matrix runner overrides only these three switches.
  ablation:
    salt_enabled: true
    progpo_enabled: true
    lata_enabled: true
  salt:
    history_length: 3
  progpo:
    tau_reward: 1.0e-3
    tau_progress: 1.0e-4
    lambda_aux: 0.3
    lambda_fixed: false
  turn_discount:
    enable: true
    alpha: 1.05

# Two CPU reward workers avoid multiplying process/thread pools; excess work queues.
reward:
  num_workers: 2


trainer:
  total_epochs: 50
  total_training_steps: 300
  save_freq: 10
  max_actor_ckpt_to_keep: 2
  # Do not repeatedly observe the official held-out test split while training.
  val_before_train: false
  test_freq: -1
  resume_mode: auto
  default_local_dir: experiments/ablations/111_full/checkpoints
  # Console is dependency-free. Override with [console,swanlab] after login.
  logger: [console]
  project_name: agentic-grpo-longhorizon-ablation
  experiment_name: 111_full
  n_gpus_per_node: 1
  nnodes: 1
  # Custom SALT/ProGPO/LATA hooks live in the legacy RayPPOTrainer path.
  use_legacy_worker_impl: enable

ray_kwargs:
  ray_init:
    num_cpus: 8
    runtime_env:
      env_vars:
        # Prevent every Ray actor from creating a machine-sized thread pool.
        TOKENIZERS_PARALLELISM: "false"
        RAYON_NUM_THREADS: "1"
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
