# Current tau2 airline independent-evaluation template.
# The policy may be any exported ablation checkpoint; override output.dir per run.

env:
  name: airline
  user_strategy: llm
  user_model: "Qwen/Qwen2.5-72B-Instruct-AWQ"
  user_provider: openai
  user_base_url: "http://localhost:8001/v1"
  task_split: test

policy:
  model_name: "Qwen/Qwen2.5-7B-Instruct"  # served-model-name 保持不变，方便接口稳定
  base_url: "http://localhost:8000/v1"
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096

eval:
  num_tasks: null
  num_samples_per_task: 4
  max_turns: 30
  num_workers: 2

output:
  dir: "experiments/eval_sft_airline"
